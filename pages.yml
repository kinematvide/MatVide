media:
  input: uploads
  output: /uploads
  rename: safe
  categories: [image]

content:
  - name: site
    label: MATVIDE
    type: file
    path: site.json
    format: json
    fields:
      - name: brand
        label: Marca y contacto
        type: object
        fields:
          - name: name
            label: Nombre
            type: string
          - name: descriptor
            label: Descriptor
            type: string
          - name: slogan
            label: Eslogan
            type: string
          - name: location
            label: Ciudad / zona
            type: string
          - name: whatsapp
            label: WhatsApp
            type: string
            description: "Escribe el número sin +, espacios ni guiones. Ejemplo: 56912345678"
          - name: instagram
            label: Instagram
            type: string

      - name: hero
        label: Portada
        type: object
        fields:
          - name: title
            label: Título principal
            type: string
          - name: text
            label: Texto principal
            type: text
          - name: image
            label: Foto principal
            type: image
            required: false
            options:
              rename: safe

      - name: services
        label: Servicios y precios
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {price}"
        fields:
          - name: title
            label: Servicio
            type: string
          - name: description
            label: Descripción
            type: text
          - name: price
            label: Precio
            type: string

      - name: about
        label: Sobre MATVIDE
        type: object
        fields:
          - name: title
            label: Título
            type: string
          - name: text
            label: Presentación
            type: text
          - name: image
            label: Foto profesional
            type: image
            required: false
            options:
              rename: safe

      - name: gallery
        label: Galería de fotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        required: false
        fields:
          - name: image
            label: Foto
            type: image
            options:
              rename: safe
          - name: caption
            label: Descripción
            type: string
            required: false

      - name: videos
        label: Videos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        required: false
        fields:
          - name: title
            label: Título
            type: string
          - name: url
            label: Enlace del video
            type: string
