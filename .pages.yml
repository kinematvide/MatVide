media:
  input: uploads
  output: uploads
  rename: safe
  categories: [image]

content:
  - name: site
    label: MATVIDE
    type: file
    path: site.json
    format: json
    fields:
      - name: brand
        label: Marca y contacto
        type: object
        fields:
          - {name: name, label: Nombre, type: string}
          - {name: descriptor, label: Descriptor, type: string}
          - {name: slogan, label: Eslogan, type: string}
          - {name: location, label: Ciudad / zona, type: string}
          - name: whatsapp
            label: WhatsApp
            type: string
            description: "Número sin +, espacios ni guiones. Ejemplo: 56912345678"
          - {name: instagram, label: Instagram, type: string}
          - {name: logo, label: Logo, type: image, required: false}

      - name: hero
        label: Portada
        type: object
        fields:
          - {name: badge, label: Texto pequeño superior, type: string}
          - {name: title, label: Título principal, type: string}
          - {name: text, label: Texto principal, type: text}
          - {name: image, label: Foto de fondo, type: image, required: false}

      - name: services_intro
        label: Introducción de servicios
        type: object
        fields:
          - {name: label, label: Texto pequeño, type: string}
          - {name: title, label: Título, type: string}
          - {name: text, label: Descripción, type: text}

      - name: services
        label: Servicios y precios
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {price}"
        fields:
          - {name: title, label: Servicio, type: string}
          - {name: description, label: Descripción, type: text}
          - {name: price, label: Precio, type: string}
          - {name: icon, label: Ícono del servicio, type: image, required: false}
          - name: category
            label: Categoría
            type: select
            options:
              values:
                - {name: adultos, label: Adultos}
                - {name: pediatria, label: Pediatría}
                - {name: otros, label: Otros servicios}

      - name: pain_points
        label: "¿Te pasa algo de esto?"
        type: object
        fields:
          - {name: title, label: Título, type: string}
          - {name: subtitle, label: Texto de apoyo, type: text}
          - name: items
            label: Situaciones
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - {name: title, label: Título, type: string}
              - {name: text, label: Descripción, type: text}

      - name: why_choose
        label: Por qué elegir MATVIDE
        type: object
        fields:
          - {name: title, label: Título, type: string}
          - {name: subtitle, label: Texto de apoyo, type: text}
          - name: items
            label: Razones
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - {name: title, label: Título, type: string}
              - {name: text, label: Descripción, type: text}

      - name: about
        label: Sobre MATVIDE
        type: object
        fields:
          - {name: title, label: Título, type: string}
          - {name: text, label: Presentación, type: text}
          - {name: image, label: Foto profesional, type: image, required: false}

      - {name: testimonials_title, label: Título de testimonios, type: string}
      - name: testimonials
        label: Testimonios
        type: object
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - {name: name, label: Nombre o iniciales, type: string}
          - {name: text, label: Testimonio, type: text}
          - {name: detail, label: Detalle opcional, type: string, required: false}

      - name: faq
        label: Preguntas frecuentes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - {name: question, label: Pregunta, type: string}
          - {name: answer, label: Respuesta, type: text}

      - name: gallery
        label: Galería de fotos
        type: object
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - {name: image, label: Foto, type: image}
          - {name: caption, label: Descripción, type: string, required: false}

      - name: videos
        label: Videos
        type: object
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - {name: title, label: Título, type: string}
          - {name: url, label: Enlace del video, type: string}
